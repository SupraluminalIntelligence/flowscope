[project]
name = "flowscope"
version = "0.1.0"
description = "Live view of the forward and backward pass through a network while it trains."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy"]

[project.scripts]
flowscope = "flowscope.cli:main"

[dependency-groups]
dev = ["pytest", "ipykernel", "nbclient", "nbformat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
