[project]
name = "flowscope"
version = "0.1.0"
description = "Live view of the forward and backward pass through a network while it trains."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy"]

[project.scripts]
flowscope = "flowscope.cli:main"

[project.optional-dependencies]
# compare checkpoints of Hugging Face models (flowscope.compare, examples/harness_compare.py)
compare = ["transformers>=4.57", "pyarrow", "huggingface_hub"]

[dependency-groups]
dev = ["pytest", "ipykernel", "nbclient", "nbformat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
